<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="host.title">Ask &amp; Answer – Host</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div>
        <h1 data-i18n="host.title">Ask &amp; Answer – Host</h1>
        <p class="subtitle" data-i18n="host.subtitle">Tạo phòng, mở câu hỏi và xem câu trả lời theo thời gian thực.</p>
      </div>
      <select id="langSelect" class="lang-select" data-i18n-aria-label="lang.label" aria-label="Ngôn ngữ"></select>
    </header>

    <!-- Before a room exists -->
    <section id="createScreen" class="card">
      <button id="createBtn" class="full" data-i18n="host.create">TẠO PHÒNG</button>
      <p id="hostError" class="error"></p>
    </section>

    <!-- Room dashboard -->
    <section id="roomScreen" class="hidden">
      <div class="card row-between">
        <div>
          <div class="subtitle" style="margin:0" data-i18n="host.roomCode">Mã phòng</div>
          <div id="roomCode" class="room-code"></div>
        </div>
        <button id="newRoomBtn" class="gray" data-i18n="host.newRoom">Tạo phòng mới</button>
      </div>

      <div class="card">
        <div class="row-between" style="margin-bottom:14px">
          <div id="status" class="status" style="margin:0;flex:1">Chưa mở câu hỏi</div>
          <div id="timer" class="timer">0.00s</div>
        </div>
        <div class="controls">
          <button id="startBtn" class="green">MỞ CÂU HỎI</button>
          <button id="lockBtn" class="orange" disabled data-i18n="host.lock">KHÓA / DỪNG</button>
          <button id="resetBtn" class="gray" data-i18n="host.reset">XÓA LƯỢT</button>
        </div>
        <label class="toggle">
          <input id="multiToggle" type="checkbox" />
          <span data-i18n="host.allowMultiple">Cho phép người chơi trả lời nhiều lần trong một câu</span>
        </label>
      </div>

      <div class="card">
        <div class="row-between" style="margin-bottom:8px">
          <strong><span class="live-dot"></span><span data-i18n="host.playersOnline">Người chơi đang online</span></strong>
          <span id="playerCount" class="players">0 người</span>
        </div>
        <ul id="playerList" class="player-list"></ul>
        <p id="emptyPlayers" class="empty" data-i18n="host.noPlayers">Chưa có ai vào phòng.</p>
      </div>

      <div class="card">
        <div class="row-between" style="margin-bottom:8px">
          <strong data-i18n="host.answers">Câu trả lời</strong>
          <span id="answerCount" class="players">0 người đã trả lời</span>
        </div>
        <ul id="feed" class="feed"></ul>
        <p id="emptyFeed" class="empty" data-i18n="host.noAnswers">Chưa có câu trả lời nào.</p>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
